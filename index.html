<style>
:root{
  --ivory:#F6EDE1; --ink:#2E2013; --indigo:#5B3A22; --thread:#A85C32;
  --sage:#8C6A4F; --line:#E2D0B4; --card:#FFFCF6; --muted:#8A7461;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ivory:#1E1712; --ink:#EFE4D6; --card:#2A2019; --line:#42352A; --muted:#B7A692; --indigo:#7A5330; --thread:#C97847; --sage:#A9866A; }
}
:root[data-theme="dark"]{ --ivory:#1E1712; --ink:#EFE4D6; --card:#2A2019; --line:#42352A; --muted:#B7A692; --indigo:#7A5330; --thread:#C97847; --sage:#A9866A; }
*{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; min-height:100%; background:var(--ivory); color:var(--ink); font-family:Inter,sans-serif;}
h1,h2,h3{font-family:Fraunces,serif; font-weight:700; margin:0 0 4px;}
header.top{position:sticky; top:0; z-index:10; background:var(--indigo); color:#fff; padding:14px 18px; padding-top:calc(14px + env(safe-area-inset-top,0px)); display:flex; justify-content:space-between; align-items:center;}
header.top .brand{font-family:Fraunces,serif; font-size:20px;}
header.top .sub{font-size:11px; opacity:.7;}
nav.tabs{display:flex; overflow-x:auto; gap:4px; background:var(--card); border-bottom:1px solid var(--line); padding:6px 8px; position:sticky; top:56px; z-index:9;}
nav.tabs button{flex:none; padding:8px 14px; border:none; background:transparent; color:var(--muted); font-size:13.5px; border-radius:8px; cursor:pointer; white-space:nowrap;}
nav.tabs button.active{background:var(--indigo); color:#fff;}
main{padding:16px; max-width:960px; margin:0 auto 60px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px;}
.stat{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
.stat .n{font-family:Fraunces,serif; font-size:22px;}
.stat .l{font-size:12px; color:var(--muted);}
.panel{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th,td{text-align:left; padding:8px 6px; border-bottom:1px solid var(--line);}
th{color:var(--muted); font-weight:600; font-size:12px;}
.tblwrap{overflow-x:auto;}
input,select,textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; background:var(--ivory); color:var(--ink); font-size:14px; font-family:inherit;}
label{font-size:12px; color:var(--muted); display:block; margin:8px 0 3px;}
.row{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
button.btn{background:var(--indigo); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600;}
button.btn.thread{background:var(--thread);}
button.btn.ghost{background:transparent; color:var(--indigo); border:1px solid var(--indigo);}
button.small{padding:5px 10px; font-size:12px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer;}
.empty{text-align:center; padding:30px 10px; color:var(--muted);}
.badge{padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;}
.badge.low{background:#F6D9DC; color:var(--thread);}
.badge.ok{background:#DCE6D6; color:#3E5233;}
.toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--ivory); padding:10px 18px; border-radius:8px; font-size:13.5px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99;}
.toast.show{opacity:1;}
.itemrow{display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:8px; align-items:end; margin-bottom:8px;}
.bar{height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:4px;}
.bar i{display:block; height:100%; background:var(--sage);}
.iconBtn{width:34px; height:34px; border-radius:50%; border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;}
</style>
</head>

<script>
const KEY='lasoft_bms_v1';
let db = JSON.parse(localStorage.getItem(KEY)||'null') || seed();
let tab='dashboard';

function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
let modalState = null;
function renderModal(){
  const r = document.getElementById('modalRoot');
  if(!modalState){ r.innerHTML=''; return; }
  if(modalState.type==='payment'){
    const o = modalState.order;
    r.innerHTML = `<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px" onclick="if(event.target===this) closeModal()">
      <div class="panel" style="max-width:360px;width:100%;margin:0" onclick="event.stopPropagation()">
        <h3 style="margin-top:0">Record Payment</h3>
        <div style="margin-bottom:10px;color:var(--muted)">Balance due: <b>${fmt(modalState.balance)}</b></div>
        <label>Amount received now</label>
        <input id="pay_amt" type="number" value="${modalState.balance}" autofocus style="width:100%">
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn small" onclick="confirmPayment('${o.id}')">✅ Save</button>
          <button class="small" onclick="closeModal()">Cancel</button>
        </div>
      </div>
    </div>`;
    setTimeout(()=>{ const el=document.getElementById('pay_amt'); if(el) el.focus(); },50);
  }
  if(modalState.type==='wagepay'){
    const wg = modalState.wage;

// ---------- calculations ----------
function customerStats(cid){
  const os = db.orders.filter(o=>o.customerId===cid);
  const totalSales = os.reduce((s,o)=>s+orderGrandTotal(o),0);
  const totalPaid = os.reduce((s,o)=>s+(o.paid||0),0);
  return {orders:os.length, pending:os.filter(o=>o.status!=='Delivered'&&o.status!=='Cancelled').length,
    delivered:os.filter(o=>o.status==='Delivered').length, totalSales, totalPaid, outstanding: totalSales-totalPaid};
}
function orderSubtotal(o){ return o.items.reduce((s,it)=>s+(it.qty*it.price - (it.discount||0)),0); }
function orderGrandTotal(o){ return orderSubtotal(o) - (o.discount||0) + (o.transport||0) + (o.otherCharges||0); }
function orderCost(o){ return o.items.reduce((s,it)=>{ const p=db.products.find(x=>x.id===it.productId); return s+(p?p.prodCost:0)*it.qty; },0); }
function orderProfit(o){ return orderGrandTotal(o) - orderCost(o) - (o.transport||0); }

function todayExpenses(d){ return db.expenses.filter(e=>e.date===d).reduce((s,e)=>s+Number(e.amount),0); }
function monthKey(d){ return d.slice(0,7); }

function dayLabel(i){ const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toLocaleDateString(undefined,{weekday:'short'}); }
function last6Months(){
  const out=[];
  for(let i=5;i>=0;i--){
    const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const mk = d.toISOString().slice(0,7);
    const os = db.orders.filter(o=>monthKey(o.date)===mk);
    const sales = os.reduce((s,o)=>s+orderGrandTotal(o),0);
    const expenses = db.expenses.filter(e=>monthKey(e.date)===mk).reduce((s,e)=>s+Number(e.amount),0);
    const expensesNonMaterial = db.expenses.filter(e=>monthKey(e.date)===mk && e.category!=='Raw Material').reduce((s,e)=>s+Number(e.amount),0);
    const profit = os.reduce((s,o)=>s+orderProfit(o),0) - expensesNonMaterial;
    out.push({label:d.toLocaleDateString(undefined,{month:'short'}), sales, expenses, profit});
  }
  return out;
}
function last7Sales(){
  const arr=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const ds=d.toISOString().slice(0,10);
    arr.push(db.orders.filter(o=>o.date===ds).reduce((s,o)=>s+orderGrandTotal(o),0)); }
  return arr;
}

function addCostComponent(pid){

  if(!p.costComponents) p.costComponents=[];

function removeCostComponent(pid, idx){
  const p = db.products.find(x=>x.id===pid); if(!p||!p.costComponents) return;

  recomputeProductCost(pid);

function recomputeProductCost(pid){
  const p = db.products.find(x=>x.id===pid); if(!p) return;

  p.prodCost = total;

function saveCostToHistory(pid){

}

function addMaterial(){
  const name=document.getElementById('mf_name').value.trim();
  if(!name){ toast('Material name required'); return; }
  const qty=Number(document.getElementById('mf_qty').value||0);
  const costPerUnit=Number(document.getElementById('mf_cost').value||0);
  const supplier=document.getElementById('mf_sup').value;
  const unit=document.getElementById('mf_unit').value||'kg';
  const minStock=Number(document.getElementById('mf_min').value||0);
  const purchaseAmount = qty*costPerUnit;
  const existing = db.materials.find(mt=>mt.name.trim().toLowerCase()===name.toLowerCase());
  if(existing){
    existing.qty += qty;
    if(costPerUnit>0) existing.costPerUnit = costPerUnit;
    if(supplier) existing.supplier = supplier;
    if(minStock>0) existing.minStock = minStock;
    if(purchaseAmount>0){
      db.expenses.push({id:uid(), date:today(), category:'Raw Material', description:'Restock: '+name+(supplier?' from '+supplier:''), amount:purchaseAmount});
    }
    save(); toast(name+' stock topped up'+(purchaseAmount>0?' — logged as expense':'')); render();
    return;
  }
  db.materials.push({id:uid(), name, unit, qty,
    minStock, costPerUnit, supplier});
  if(purchaseAmount>0){
    db.expenses.push({id:uid(), date:today(), category:'Raw Material', description:'Purchase: '+name+(supplier?' from '+supplier:''), amount:purchaseAmount});
  }
  save(); toast('Material added'+(purchaseAmount>0?' — logged as expense':'')); render();
}

function viewProduction(){
  const rowsHtml = prodMatRows.map((r,i)=>`<div class="itemrow">

  <div class="row">
    <div><label>Product</label><select id="prf_product">${db.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
    <div><label>Production Date</label><input id="prf_date" type="date" value="${today()}"></div>
    <div><label>Actual Qty Produced</label><input id="prf_qty" type="number"></div>
    <div><label>Other Expenses (labour etc.)</label><input id="prf_other" type="number" value="0"></div>
  </div>
  <h3 style="margin-top:16px;font-size:15px">Raw Materials Used</h3>
  ${rowsHtml}
  <button class="small" onclick="prodMatRows.push({materialId:'',qty:0}); render()">+ Add Material</button>
  <div style="margin-top:14px"><button class="btn thread" onclick="runProduction()">🏭 Complete Production</button></div>
  </div>
  <div class="panel"><h3>Production History (${db.production.length})</h3>
  ${db.production.length===0?`<div class="empty">No Production Records<br>Create a production batch.</div>`:
  `<div class="tblwrap"><table><tr><th>Date</th><th>Product</th><th>Qty</th><th>Total Cost</th><th>Cost/Piece</th></tr>
  ${db.production.slice().reverse().map(pr=>`<tr><td>${pr.date}</td><td>${productName(pr.productId)}</td><td>${pr.actualQty}</td><td>${fmt(pr.totalCost)}</td><td>${fmt(pr.costPerPiece)}</td></tr>`).join('')}
  </table></div>`}</div>`;
}
function productName(id){ const p=db.products.find(x=>x.id===id); return p?p.name:'-'; }
function runProduction(){
  const productId=document.getElementById('prf_product').value;
  const date=document.getElementById('prf_date').value||today();
  const actualQty=Number(document.getElementById('prf_qty').value||0);
  const other=Number(document.getElementById('prf_other').value||0);
  if(!productId||actualQty<=0){ toast('Select product and valid quantity'); return; }
  const usedRows = prodMatRows.filter(r=>r.materialId && r.qty>0);
  for(const r of usedRows){ const mt=db.materials.find(x=>x.id===r.materialId);
    if(!mt || mt.qty<r.qty){ toast('Insufficient material: '+(mt?mt.name:'')); return; } }
  let matCost=0;
  usedRows.forEach(r=>{ const mt=db.materials.find(x=>x.id===r.materialId); mt.qty-=r.qty; matCost+=r.qty*mt.costPerUnit; });
  const totalCost = matCost + other;
  const costPerPiece = totalCost/actualQty;
  const product = db.products.find(p=>p.id===productId);
  product.stock += actualQty; product.prodCost = Math.round(costPerPiece*100)/100;
  db.production.push({id:uid(), date, productId, actualQty, materialsUsed:usedRows, otherExpenses:other, totalCost, costPerPiece});
  prodMatRows=[{materialId:'',qty:0}];
  save(); toast('Production completed — stock updated'); render();
}

function workerStats(wid){
  const entries = db.wages.filter(w=>w.workerId===wid);
  const earned = entries.reduce((s,w)=>s+w.amount,0);
  const paid = entries.reduce((s,w)=>s+(w.paid||0),0);
  return {earned, paid, outstanding: earned-paid, entries};
}

function addWorker(){
  const name=document.getElementById('wf_name').value.trim();
  if(!name){ toast('Worker name required'); return; }
  db.workers.push({id:uid(), name, phone:document.getElementById('wf_phone').value, jobType:document.getElementById('wf_job').value,
    paymentType:document.getElementById('wf_type').value, rate:Number(document.getElementById('wf_rate').value||0), joined:today(), productRates:{}});
  save(); toast('Worker added'); render();
}
function setWorkerProductRate(workerId){
  const w = db.workers.find(x=>x.id===workerId); if(!w) return;
  const pid = document.getElementById('wpr_product_'+workerId).value;
  const rate = Number(document.getElementById('wpr_rate_'+workerId).value||0);
  if(!pid){ toast('Select a handkerchief type'); return; }
  if(!w.productRates) w.productRates={};
  w.productRates[pid] = rate;
  save(); toast('Rate set for '+ (db.products.find(p=>p.id===pid)||{}).name); render();
}
function removeWorkerProductRate(workerId, pid){
  const w = db.workers.find(x=>x.id===workerId); if(!w||!w.productRates) return;
  delete w.productRates[pid];
  save(); render();
}
function logWage(){
  const workerId=document.getElementById('we_worker').value;
  if(!workerId){ toast('Add a worker first'); return; }
  const w = db.workers.find(x=>x.id===workerId);
  const productId = document.getElementById('we_product') ? document.getElementById('we_product').value : '';
  const pieces = Number(document.getElementById('we_pieces').value||0);
  let amount = Number(document.getElementById('we_amount').value||0);
  if(w.paymentType==='piece' && pieces>0){
    const rate = (productId && w.productRates && w.productRates[productId]!=null) ? w.productRates[productId] : w.rate;
    amount = pieces*rate;
  }
  const paid = Number(document.getElementById('we_paid').value||0);
  if(amount<=0 && paid<=0){ toast('Enter pieces/amount or paid'); return; }
  db.wages.push({id:uid(), workerId, productId, date:document.getElementById('we_date').value||today(), pieces, amount, paid});
  save(); toast('Wage entry saved'); render();
}
function payWage(wageId){
  const wg = db.wages.find(x=>x.id===wageId); if(!wg) return;
  const bal = Math.max(0, wg.amount-(wg.paid||0));
  modalState = {type:'wagepay', wage:wg, balance:bal};
  renderModal();
}
function confirmWagePayment(wageId){
  const wg = db.wages.find(x=>x.id===wageId); if(!wg) return;
  const amt = Number(document.getElementById('pay_amt').value||0);
  if(amt<=0){ toast('Enter a valid amount'); return; }
  wg.paid = (wg.paid||0) + amt;
  save(); closeModal(); toast('Wage payment recorded — '+fmt(amt)); render();
}

function recordPayment(orderId){
  const o = db.orders.find(x=>x.id===orderId); if(!o) return;
  const gt = orderGrandTotal(o); const bal = Math.max(0, gt-(o.paid||0));
  modalState = {type:'payment', order:o, balance:bal};
  renderModal();
}
function custName(id){ const c=db.customers.find(x=>x.id===id); return c?c.name:'-'; }
function onCustSelectChange(val){
  if(val==='__new__'){ showNewCustomerForm=true; orderSelectedCustomerId=''; }
  else { showNewCustomerForm=false; orderSelectedCustomerId=val; }
  render();
}
function quickAddCustomer(){
  const name=document.getElementById('nc_name').value.trim();
  if(!name){ toast('Shop name required'); return; }
  const c={id:uid(), name, phone:document.getElementById('nc_phone').value, city:document.getElementById('nc_city').value};
  db.customers.push(c); save();
  orderSelectedCustomerId=c.id; showNewCustomerForm=false;
  toast('Shop added — selected for this order'); render();
}
function updateStatus(id,val){ const o=db.orders.find(x=>x.id===id); o.status=val; save(); toast('Status updated: '+val); }
function createOrder(){
  const customerId=orderSelectedCustomerId || document.getElementById('of_cust').value;
  const items = orderItemRows.filter(r=>r.productId && r.qty>0);
  if(!customerId || customerId==='__new__' || items.length===0){ toast('Select customer and at least one product'); return; }
  for(const it of items){ const p=db.products.find(x=>x.id===it.productId);
    if(p.stock<it.qty) toast('Note: '+p.name+' shortage — production may be required'); }
  const order={id:uid(), customerId, date:document.getElementById('of_date').value||today(),
    deliveryDate:document.getElementById('of_delivery').value, items,
    transport:Number(document.getElementById('of_transport').value||0),
    otherCharges:Number(document.getElementById('of_other').value||0),
    discount:Number(document.getElementById('of_discount').value||0),
    paid:Number(document.getElementById('of_advance').value||0), status:'Confirmed'};
  items.forEach(it=>{ const p=db.products.find(x=>x.id===it.productId); p.stock=Math.max(0,p.stock-it.qty); });
  db.orders.push(order); orderItemRows=[{productId:'',qty:0,price:0,discount:0}]; orderSelectedCustomerId=''; showNewCustomerForm=false;
  save(); toast('Order saved'); render();
}

  </div>
  <div class="panel"><h3>Expenses by Category</h3>
  ${Object.keys(expByCat).length===0?`<div class="empty">No expenses this month</div>`:
  `<table>${Object.entries(expByCat).map(([k,v])=>`<tr><td>${k}</td><td style="text-align:right">${fmt(v)}</td></tr>`).join('')}</table>`}</div>
  <div class="panel"><h3>Customer Balances</h3>
  ${custBalances.length===0?`<div class="empty">No outstanding customer balances</div>`:
  `<table>${custBalances.map(c=>`<tr><td>${c.name}</td><td style="text-align:right">${fmt(c.out)}</td></tr>`).join('')}</table>`}</div>
  <div class="panel"><h3>Supplier Balances</h3>
  ${supBalances.length===0?`<div class="empty">No outstanding supplier balances</div>`:
  `<table>${supBalances.map(s=>`<tr><td>${s.name}</td><td style="text-align:right">${fmt(s.out)}</td></tr>`).join('')}</table>`}</div>
  <div class="panel"><h3>Unpaid Labour Wages</h3>

  `<table>${labourOut.map(w=>`<tr><td>${w.name}</td><td style="text-align:right">${fmt(w.out)}</td></tr>`).join('')}</table>`}</div>`;
}

// ---------- Receipt image + WhatsApp share ----------
function buildReceiptCanvas(o){
  const c = document.createElement('canvas');
  const W=640, rowH=26, headH=190, footH=90;
  const H = headH + 40 + o.items.length*rowH + 140 + footH;
  c.width=W; c.height=H;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#FFFCF6'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5B3A22'; ctx.fillRect(0,0,W,110);
  ctx.fillStyle='#FFF'; ctx.font='700 28px Georgia,serif'; ctx.fillText(db.bizName||'CRONY', 24, 50);
  ctx.font='13px Arial'; ctx.fillStyle='#EFE1D2'; ctx.fillText('Wholesale Order Receipt', 24, 74);
  ctx.fillText('Order #'+o.id.toUpperCase()+'   Date: '+o.date, 24, 94);
  let y=140;
  ctx.fillStyle='#2E2013'; ctx.font='700 16px Arial';
  ctx.fillText('Customer: '+custName(o.customerId), 24, y); y+=22;
  if(o.deliveryDate){ ctx.font='13px Arial'; ctx.fillStyle='#8A7461'; ctx.fillText('Expected Delivery: '+o.deliveryDate, 24, y); y+=22; }
  y+=6; ctx.strokeStyle='#E2D0B4'; ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(W-24,y); ctx.stroke(); y+=20;
  ctx.font='700 12px Arial'; ctx.fillStyle='#8A7461';
  ctx.fillText('ITEM', 24, y); ctx.fillText('QTY', 340, y); ctx.fillText('PRICE', 420, y); ctx.fillText('TOTAL', 520, y); y+=14;
  ctx.font='14px Arial'; ctx.fillStyle='#2E2013';
  o.items.forEach(it=>{
    const p=db.products.find(x=>x.id===it.productId);
    const tot=it.qty*it.price-(it.discount||0);
    y+=rowH;
    ctx.fillText((p?p.name:'-'), 24, y);
    ctx.fillText(String(it.qty), 340, y);
    ctx.fillText(fmt(it.price), 420, y);
    ctx.fillText(fmt(tot), 520, y);
  });
  y+=26; ctx.strokeStyle='#E2D0B4'; ctx.beginPath(); ctx.moveTo(24,y); ctx.lineTo(W-24,y); ctx.stroke(); y+=26;
  const lines=[['Subtotal', orderSubtotal(o)],['Discount', -(o.discount||0)],['Transport', o.transport||0],['Other Charges', o.otherCharges||0]];
  ctx.font='13px Arial'; ctx.fillStyle='#8A7461';
  lines.forEach(([l,v])=>{ ctx.fillText(l, 400, y); ctx.fillText(fmt(v), 520, y); y+=20; });
  ctx.font='700 17px Arial'; ctx.fillStyle='#2E2013';
  ctx.fillText('Grand Total', 380, y); ctx.fillText(fmt(orderGrandTotal(o)), 520, y); y+=24;
  ctx.font='14px Arial'; ctx.fillStyle='#8C6A4F';
  ctx.fillText('Paid: '+fmt(o.paid||0), 380, y); y+=20;
  ctx.fillText('Balance: '+fmt(orderGrandTotal(o)-(o.paid||0)), 380, y); y+=20;
  ctx.font='700 13px Arial'; ctx.fillStyle='#A85C32'; ctx.fillText('Status: '+o.status, 24, y);
  ctx.font='12px Arial'; ctx.fillStyle='#8A7461'; ctx.textAlign='center';
  ctx.fillText('Powered by CRONY', W/2, H-30);
  ctx.textAlign='left';
  return c;
}
function shareReceipt(orderId){
  const o = db.orders.find(x=>x.id===orderId);
  const canvas = buildReceiptCanvas(o);
  canvas.toBlob(async blob=>{
    const file = new File([blob], 'receipt-'+o.id+'.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'CRONY Receipt', text:'Order receipt from CRONY'}); return; }catch(e){}
    }
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='receipt-'+o.id+'.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Receipt image downloaded — attach it in WhatsApp');
  }, 'image/png');
}

// ---------- Expenses ----------
function viewExpenses(){
  return `<div class="panel"><h3>Add Expense</h3>
  <div class="row">
    <div><label>Date</label><input id="ef_date" type="date" value="${today()}"></div>
    <div><label>Category</label><select id="ef_cat">${['Raw Material','Labour','Electricity','Transport','Packaging','Machine Maintenance','Rent','Salary','Marketing','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div><label>Description</label><input id="ef_desc"></div>
    <div><label>Amount</label><input id="ef_amt" type="number"></div>
  </div>
  <div style="margin-top:12px"><button class="btn thread" onclick="addExpense()">Save Expense</button></div>
  </div>
  <div class="panel"><h3>Expenses (${db.expenses.length})</h3>
  ${db.expenses.length===0?`<div class="empty">No Expenses<br>Add your first business expense.</div>`:
  `<div class="tblwrap"><table><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr>
  ${db.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${e.category}</td><td>${e.description||'-'}</td><td>${fmt(e.amount)}</td></tr>`).join('')}
  </table></div>`}</div>`;
}
function addExpense(){
  const amt=Number(document.getElementById('ef_amt').value||0);
  if(amt<=0){ toast('Enter a valid amount'); return; }
  db.expenses.push({id:uid(), date:document.getElementById('ef_date').value||today(), category:document.getElementById('ef_cat').value,
    description:document.getElementById('ef_desc').value, amount:amt});
  save(); toast('Expense recorded'); render();
}

    <div><label>Phone</label><input id="sf_bizphone" value="${db.phone}"></div>

    </select></div>

  </div>
  <div class="panel"><h3>About</h3>
  <div>CRONY Handkerchief BMS</div>
  <div style="color:var(--muted);font-size:13px">Version 1.0.0</div>

// ---------- Backup & Restore ----------
function counts(){
  return {Customers:db.customers.length, Products:db.products.length, 'Raw Materials':db.materials.length,
    'Production Batches':db.production.length, Orders:db.orders.length, Expenses:db.expenses.length};
}
function viewBackup(){
  const c = counts();
  return `<div class="panel"><h3>Export Backup</h3>
  <p style="color:var(--muted);font-size:13.5px;margin-top:0">Download everything — customers, products, raw materials, production, orders, expenses and settings — as one file you can keep safe or move to another device.</p>
  <div class="tblwrap"><table>${Object.entries(c).map(([k,v])=>`<tr><td>${k}</td><td>${v} records</td></tr>`).join('')}</table></div>
  <div style="margin-top:12px"><button class="btn" onclick="exportBackup()">⬇ Download Backup (.json)</button></div>
  </div>
  <div class="panel"><h3>Restore Backup</h3>
  <p style="color:var(--muted);font-size:13.5px;margin-top:0">Restoring replaces all current data in this browser with the data from the backup file. This cannot be undone.</p>
  <input type="file" id="bf_file" accept="application/json">
  <div style="margin-top:12px"><button class="btn thread" onclick="restoreBackup()">⬆ Restore from File</button></div>
  </div>
  <div class="panel"><h3>Clear All Data</h3>
  <p style="color:var(--muted);font-size:13.5px;margin-top:0">Erases every customer, product, material, order and expense in this browser and starts fresh, empty.</p>
  <button class="btn ghost" onclick="resetDemo()">Clear All Data</button>
  </div>`;
}
function exportBackup(){
  const payload = {app:'La Soft — Handkerchief BMS', exportedAt:new Date().toISOString(), data:db};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lasoft-bms-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function restoreBackup(){
  const f = document.getElementById('bf_file').files[0];
  if(!f){ toast('Choose a backup file first'); return; }
  if(!confirm('This will replace ALL current data with the backup file. Continue?')) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = parsed.data || parsed;
      if(!incoming.customers || !incoming.products){ toast('Invalid backup file'); return; }
      db = incoming; save(); toast('Backup restored'); setTab('dashboard');
    }catch(err){ toast('Could not read file — invalid JSON'); }
  };
  reader.readAsText(f);
}
function resetDemo(){
  if(!confirm('This permanently erases all current data. Continue?')) return;
  db = seed(); save(); toast('All data cleared'); setTab('dashboard');
}

// ---------- theme ----------
const THEME_ORDER=['','light','dark'];
const THEME_ICON={'':'🌓', light:'☀️', dark:'🌙'};
let currentTheme = localStorage.getItem('crony_theme') || '';
document.documentElement.setAttribute('data-theme', currentTheme);
function updateThemeIcon(){ document.getElementById('themeBtn').textContent = THEME_ICON[currentTheme]; }
function cycleTheme(){
  currentTheme = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme)+1)%THEME_ORDER.length];
  document.documentElement.setAttribute('data-theme', currentTheme);
  localStorage.setItem('crony_theme', currentTheme);
  updateThemeIcon();
}
updateThemeIcon();

// ---------- offline support ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
function updateNetBadge(){
  const b = document.getElementById('netBadge');
  if (b) b.style.display = navigator.onLine ? 'none' : 'inline-block';
}
window.addEventListener('online', updateNetBadge);
window.addEventListener('offline', updateNetBadge);
updateNetBadge();

render();
</script>
